<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone radius -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" />
  
  <!-- Central Shield / EE Bolt Motif -->
  <g transform="translate(106, 106)">
    <!-- Circuit lines -->
    <path d="M 50 150 L 110 150 L 130 190 L 170 190" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <path d="M 250 150 L 190 150 L 170 110 L 130 110" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <circle cx="50" cy="150" r="10" fill="#38bdf8" />
    <circle cx="250" cy="150" r="10" fill="#38bdf8" />
    
    <!-- Central Lightning Focus Bolt -->
    <path d="M 165 40 L 105 160 L 155 160 L 135 260 L 215 130 L 165 130 Z" fill="url(#accent)" filter="drop-shadow(0px 8px 16px rgba(245, 158, 11, 0.4))" />
  </g>
</svg>
